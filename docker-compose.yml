services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-video2knowledge}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./SourceCode/backend
      dockerfile: Dockerfile.gpu
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-video2knowledge}
      UPLOAD_DIR: /app/uploads
      DATASET_ROOT: /app/dataset
      ALLOWED_ORIGINS: '["*"]'
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    expose:
      - "8000"
    volumes:
      - ./dataset:/app/dataset:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g

  sop-detector:
    # SOP steps (clicks and typing) read from the video alone; see SOP-detector/README.md.
    # Switched off: started only with `docker compose --profile sop-detector up`, and the
    # frontend uses it only when built with VITE_SOP_DETECTOR_ENABLED=true.
    profiles: ["sop-detector"]
    build: ./SOP-detector
    environment:
      SOP_DETECTOR_THREADS: "4"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8100:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g

  frontend:
    build:
      context: ./SourceCode/frontend
      args:
        VITE_SOP_DETECTOR_ENABLED: "false"
        VITE_SOP_DETECTOR_URL: /sop-detector
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
