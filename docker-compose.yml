services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-video2knowledge}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./SourceCode/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-video2knowledge}
      UPLOAD_DIR: /app/uploads
      DATASET_ROOT: /app/dataset
      ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g

  frontend:
    build:
      context: ./SourceCode/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
