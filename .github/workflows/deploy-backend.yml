name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "SourceCode/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: SourceCode/backend
        # CPU-only torch keeps the test job small; the ML extras are needed
        # because most tests import app.ml (numpy, scikit-learn, torch).
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,aws,dev]"

      - name: Lint
        working-directory: SourceCode/backend
        run: ruff check app/

      # Non-blocking until the existing type errors (mostly app/ml/tracking.py and
      # torch model attributes) are fixed; the report still shows in the job log.
      - name: Type check
        continue-on-error: true
        working-directory: SourceCode/backend
        run: mypy app/ --ignore-missing-imports

      - name: Run tests
        working-directory: SourceCode/backend
        run: pytest tests/ -x -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The CUDA + torch image is ~10 GB; the runner only has ~14 GB free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: SourceCode/backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # Skipped until the App Runner service exists and APPRUNNER_SERVICE_ARN is set.
      - name: Trigger App Runner deployment
        if: ${{ vars.APPRUNNER_SERVICE_ARN != '' }}
        run: |
          aws apprunner start-deployment --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}"
